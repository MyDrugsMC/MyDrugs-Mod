modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/mydrugsmc/mydrugs/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/mydrugsmc/mydrugs"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "terrablender"
type = "required"
reason = "MyDrugs registers custom biome regions and surface rules through TerraBlender."
versionRange = "[1.21.10-21.10.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
reason = "JEI integration provides recipe categories and discoverability, but MyDrugs should remain playable without JEI."
versionRange = "[26.2.0.30,)"
ordering = "AFTER"
side = "CLIENT"