# =====================================================================
# MyDrugs - pinned external tool manifest
# =====================================================================
# These optional tools are NEVER downloaded automatically. In-GUI download
# stays DISABLED for any tool/platform whose values below are still the
# <PLACEHOLDER> text. Manual install instructions are always available.
#
# HOW TO ENABLE AN IN-GUI DOWNLOAD (maintainer task):
#   1. Choose an EXACT, immutable release. Never use "latest", a moving
#      tag, or a nightly build.
#   2. Download that exact artifact yourself from the official source.
#        - yt-dlp: official GitHub release assets only
#          https://github.com/yt-dlp/yt-dlp/releases
#        - FFmpeg: see https://ffmpeg.org/download.html . Compiled builds
#          are third-party; only fill a URL you personally verified.
#   3. Compute its SHA-256:
#        Windows : certutil -hashfile <file> SHA256
#        Linux   : sha256sum <file>
#        macOS   : shasum -a 256 <file>
#   4. Paste the exact version, exact download URL, and SHA-256 below.
#      Keep the value lowercase, 64 hex characters.
#   5. ARCHIVE is "raw" for a single executable, or "zip" to extract the
#      executable entry from a .zip archive.
#
# ffprobe ships INSIDE FFmpeg distributions. Point the FFPROBE_* entries
# at the SAME verified archive you used for FFMPEG.
# =====================================================================

